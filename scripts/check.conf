# scripts/check.conf — the steps behind the single verification contract (./scripts/check).
# Generated by bootstrap 2026-11-26 — POLSAN RADAR (.NET 10 + React/TS + PostgreSQL 17).
# Format: one step per line  <name>: <command>  — runs in order, fails fast. [fast] in the NAME.
# Prerequisites: requires <step name>: <command>  (exit 0 = this machine can run the step).
#
# GREENFIELD: rule 1 (no spec, no code) means there is no code yet, so every step below is a
# PLANNED step, commented out. The walking skeleton spec (slice 1) creates the solution and the
# web app, then uncomments these lines (adjusting paths), runs the residue test on both profiles
# and confirms the test counts. Until then doctor warns "no steps" — expected.
#
# --- Resource hygiene inventory (docs/testing.md, Resource hygiene) ---------------------------
# dotnet build/test : MSBuild worker nodes, VBCSCompiler/Razor build servers, testhost processes
#                     → -nodeReuse:false, --disable-build-servers, UseSharedCompilation=false,
#                       env MSBUILDDISABLENODEREUSE=1 DOTNET_CLI_USE_MSBUILD_SERVER=0
# Testcontainers    : PostgreSQL container + Ryuk reaper container; data in the DB
#                     → every container disposed by the test fixture, reuse off, fresh DB per run
#                       (rule 5); Ryuk left ON as the safety net for a run killed halfway
# npm ci            : no process left; node_modules is a cache, not state
# vitest            : worker pool, watch mode → always `vitest run`, pool exits with the run
# vite build        : no process left (never `vite` / `vite preview` — dev servers never in check)
# audit             : network calls only, no process left
#
# --- Planned prerequisites (exit 0 = met; quick, side-effect free) -----------------------------
# requires build: sh -c 'dotnet --list-sdks | grep -q "^10\."'
# requires web-install: node -e "process.exit(+process.versions.node.split('.')[0] >= 24 ? 0 : 1)"
# requires integration-test: docker info
# requires audit: sh -c 'npm ping >/dev/null 2>&1'
#
# --- Planned steps ------------------------------------------------------------------------------
# resource hygiene: no MSBuild node reuse, no build servers, no shared compiler server
# restore [fast]: env MSBUILDDISABLENODEREUSE=1 DOTNET_CLI_USE_MSBUILD_SERVER=0 dotnet restore PolsanRadar.sln --disable-build-servers
# build [fast]: env MSBUILDDISABLENODEREUSE=1 DOTNET_CLI_USE_MSBUILD_SERVER=0 dotnet build PolsanRadar.sln -c Release --no-restore -nodeReuse:false --disable-build-servers -p:UseSharedCompilation=false -warnaserror
# format [fast]: dotnet format PolsanRadar.sln --verify-no-changes --no-restore
# unit-test [fast]: env MSBUILDDISABLENODEREUSE=1 dotnet test PolsanRadar.sln -c Release --no-build --filter "Category!=Integration"
# web-install [fast]: npm --prefix src/web ci --no-audit --no-fund
# web-lint [fast]: npm --prefix src/web run lint
# web-typecheck [fast]: npm --prefix src/web run typecheck
# resource hygiene: vitest run (never watch mode)
# web-test [fast]: npm --prefix src/web run test:run
# full only — Testcontainers (Docker); same filter inverted, so fast ∪ full = every test
# integration-test: env MSBUILDDISABLENODEREUSE=1 dotnet test PolsanRadar.sln -c Release --no-build --filter "Category=Integration"
# web-build: npm --prefix src/web run build
# audit: sh -c 'npm --prefix src/web audit --audit-level=high && ! dotnet list PolsanRadar.sln package --vulnerable --include-transitive | grep -qE "High|Critical"'
